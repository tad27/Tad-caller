<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle inner border -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.2"/>

  <!-- Centered Directory Vault Icon (Contacts & Lock / Shield) -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Shield / Vault silhouette -->
    <path d="M150 20 C230 20 270 50 270 50 C270 180 190 250 150 280 C110 250 30 180 30 50 C30 50 70 20 150 20 Z" fill="url(#shieldGrad)"/>
    
    <!-- User Silhouette / Directory Card within Shield -->
    <!-- Head -->
    <circle cx="150" cy="115" r="38" fill="#1E40AF"/>
    <!-- Body -->
    <path d="M96 200 C96 165 120 155 150 155 C180 155 204 165 204 200 C204 212 196 222 182 226 C162 232 138 232 118 226 C104 222 96 212 96 200 Z" fill="#1E40AF"/>
    <!-- Small checkmark / keyhole accent -->
    <circle cx="150" cy="250" r="10" fill="#2563EB"/>
  </g>
</svg>
